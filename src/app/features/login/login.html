<main class="login">
  <form class="login__card" [formGroup]="loginForm" (ngSubmit)="Submit">
    <h1 class="login__title">Iniciar sesión</h1>

    <label class="login__field">
      <span>Usuario</span>
      <input type="text" formControlName="user" autocomplete="username" />
    </label>

    <label class="login__field">
      <span>Contraseña</span>
      <input type="text" formControlName="password" autocomplete="current-password" />
    </label>

    @if (errorMessage()) {
      <p class="login__error">{{ errorMessage() }}</p>
    }

    <button class="login__submit" type="submit">Entrar</button>
  </form>
</main>
